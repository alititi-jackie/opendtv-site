name: Build and deploy OpenDTV
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '21 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Restore availability history
        if: github.event_name != 'pull_request'
        id: history
        uses: actions/cache/restore@v4
        with:
          path: health-output/state.json
          key: availability-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: availability-v1-
      - name: Check official sources
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !steps.history.outputs.cache-matched-key)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if test -f health-output/state.json; then
            python scripts/health.py --previous health-output/state.json
          else
            python scripts/health.py
          fi
      - name: Verify playback on official players
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !steps.history.outputs.cache-matched-key)
        run: |
          python -m pip install --disable-pip-version-check playwright==1.58.0
          TEST_PLAYERS=1 python scripts/build.py
          python scripts/check_players.py
      - name: Save availability history
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !steps.history.outputs.cache-matched-key)
        uses: actions/cache/save@v4
        with:
          path: health-output/state.json
          key: availability-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build and test
        run: |
          python scripts/build.py
          python scripts/check.py
          node --check portal/site.js
      - name: Collect pending videos
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !steps.history.outputs.cache-matched-key)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        continue-on-error: true
        run: python scripts/catalog_ops.py fetch
      - name: Save review queue and availability report
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !steps.history.outputs.cache-matched-key)
        uses: actions/upload-artifact@v4
        with:
          name: editorial-review
          path: |
            review-output/
            health-output/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
